[project]
name = "jianying"
version = "0.1.0"
description = "剪影 — 屏幕截图 + 背景美化桌面工具（PyQt6）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.7",
    "Pillow>=10.3",
    "mss>=9.0",
    "pynput>=1.7",
    "pystray>=0.19",
    "opencv-python>=4.9",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
jianying = "jianying.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jianying"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
